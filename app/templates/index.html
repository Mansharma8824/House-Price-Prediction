<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>House Price Prediction</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{

            font-family: Arial, Helvetica, sans-serif;

            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #1e3c72,
                #2a5298
            );
        }

        .container{

            width: 420px;

            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow: 0px 10px 30px rgba(0,0,0,0.3);
        }

        h1{

            text-align: center;

            margin-bottom: 30px;

            color: #1e3c72;

            font-size: 32px;
        }

        .input-box{

            margin-bottom: 20px;
        }

        input,
        select{

            width: 100%;

            padding: 14px;

            border-radius: 10px;

            border: 1px solid #ccc;

            font-size: 16px;

            outline: none;

            transition: 0.3s;
        }

        input:focus,
        select:focus{

            border-color: #2a5298;

            box-shadow: 0px 0px 8px rgba(42,82,152,0.4);
        }

        input::placeholder{

            color: gray;

            font-size: 14px;
        }

        button{

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 10px;

            background: #2a5298;

            color: white;

            font-size: 18px;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover{

            background: #1e3c72;

            transform: scale(1.02);
        }

        .prediction{

            margin-top: 25px;

            text-align: center;

            font-size: 24px;

            color: green;

            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>🏡 House Price Prediction</h1>

        <form action="/predict" method="POST">

            <div class="input-box">
                <input type="text"
                       name="total_sqft"
                       placeholder="Enter Total Square Feet"
                       required>
            </div>

            <div class="input-box">
                <input type="text"
                       name="bath"
                       placeholder="Enter Number of Bathrooms"
                       required>
            </div>

            <div class="input-box">
                <input type="text"
                       name="balcony"
                       placeholder="Enter Number of Balconies"
                       required>
            </div>

            <div class="input-box">
                <input type="text"
                       name="bhk"
                       placeholder="Enter BHK"
                       required>
            </div>

            <div class="input-box">

                <select name="location" required>

                    {% for location in locations %}

                        <option value="{{ location }}">
                            {{ location }}
                        </option>

                    {% endfor %}

                </select>

            </div>

            <button type="submit">
                Predict Price
            </button>

        </form>

        <div class="prediction">

            {{ prediction_text }}

        </div>

    </div>

</body>

</html>
